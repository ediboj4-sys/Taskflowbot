<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Monopoly Farm - Demo</title>
<style>
  :root{
    --bg:#dff6e6;
    --primary:#2d7a3e;
    --accent:#ff6b4a;
    --gold:#ffd27a;
    --tile:#fffdf6;
    --muted:#6b7b6b;
    --panel:#ffffff;
    --shadow: 0 10px 30px rgba(22,50,22,0.08);
    --chat-bg: rgba(8,8,8,0.45);
  }

  html,body{
    height:100%;
    margin:0;
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    background: linear-gradient(180deg,#dff6e6 0%, #eefdf0 40%, #ffffff 100%);
    color:#14321a;
    display:flex;
    justify-content:center;
    padding:18px;
    box-sizing:border-box;
  }

  .app {
    width:412px; max-width:100%;
    display:flex; flex-direction:column; gap:12px; position:relative;
  }

  /* HUD */
  .hud {
    display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
    background:var(--panel); border-radius:14px; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,0.04);
  }
  .hud-left{display:flex;gap:10px;align-items:center}
  .logo {display:flex;align-items:center;gap:8px;font-weight:800;color:var(--primary);font-size:16px}
  .stats {display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  .stat {background:linear-gradient(180deg,#ffffff,#f7fff7);padding:6px 10px;border-radius:10px;border:1px solid rgba(0,0,0,0.04);font-weight:700}

  .hud-right{display:flex;gap:12px;align-items:center}
  .level{background:#f3fff3;padding:6px 10px;border-radius:999px;color:var(--primary);font-weight:800}
  .progressWrap{width:120px;height:18px;background:linear-gradient(180deg,#fff,#f0fff0);border-radius:999px;padding:3px;border:1px solid rgba(0,0,0,0.03);display:flex;align-items:center}
  .progressInner{height:100%;width:32%;background:linear-gradient(90deg,#00e0ff,#0077ff);border-radius:999px;transition:width 400ms ease}

  /* Board area */
  .board-wrap{
    background: linear-gradient(180deg,#f7fff7,#ecfbea);
    border-radius:18px; padding:12px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }

  .board { width:100%; aspect-ratio:1 / 1; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr); gap:6px; position:relative; }

  .cell{background:transparent;display:flex;align-items:center;justify-content:center}
  .tile{ width:100%; height:100%; background:var(--tile); border-radius:8px; border:3px solid rgba(240,211,169,0.9); display:flex; align-items:center; justify-content:center; font-size:13px; color:#3b2a12; box-shadow: 0 6px 14px rgba(20,40,20,0.06); position:relative; }
  .tile.q { background:linear-gradient(180deg,#fff8e6,#fff6e0); color:#6b4a1f; font-weight:800 }
  .tile.corner { border-radius:12px; font-weight:900; font-size:14px; background:linear-gradient(180deg,#fffdf6,#fff6d7) }

  .center { grid-column: 3 / span 3; grid-row: 3 / span 3; background: #f6fff6; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:2px dashed rgba(0,0,0,0.03); position:relative; }
  .boss { width:92px;height:92px;border-radius:14px; background:linear-gradient(180deg,#e6eaf7,#cfd6ff); display:flex;align-items:center;justify-content:center;flex-direction:column; box-shadow:0 10px 30px rgba(50,40,90,0.12), inset 0 -6px 12px rgba(0,0,0,0.04); border:4px solid rgba(0,0,0,0.04); cursor:pointer }
  .boss .skull{font-size:34px}
  .boss .lv{font-size:11px;color:#4a4a4a;margin-top:6px}
  .center .avatarRow{display:flex;gap:18px;margin-top:12px;align-items:flex-start}

  /* right-side menu */
  .menu {
    position:absolute; right:12px; top:38%; display:flex; flex-direction:column; gap:10px; align-items:flex-end; z-index:40;
  }
  .menu button { width:56px; height:56px; border-radius:12px; border:none; background:linear-gradient(180deg,#ffffff,#f7fff7); box-shadow:0 8px 20px rgba(20,40,20,0.06); display:flex; align-items:center; justify-content:center; font-weight:700; cursor:pointer; border:1px solid rgba(0,0,0,0.05) }
  .menu button.small{ width:46px;height:46px;border-radius:10px }

  /* harvest callout at top-center, like the image */
  .farmCall {
    position:absolute; left:50%; top:6%; transform:translateX(-50%); background:linear-gradient(180deg,#ffffff,#f0fff0); padding:8px 14px; border-radius:999px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow); border:1px solid rgba(0,0,0,0.04);
  }
  .farmCall .harvestBtn { background:linear-gradient(180deg,#3be06f,#26b14a); color:#04260a; padding:8px 12px; border-radius:10px; font-weight:800; border:none; cursor:pointer; box-shadow:0 8px 20px rgba(20,100,40,0.12) }

  /* controls bottom-right: big GO */
  .controls { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:10px; align-items:flex-end; z-index:30; }
  .go-btn { width:118px;height:118px;border-radius:60px;background:linear-gradient(180deg,#ff6b4a,#e84f2f); color:white;font-size:28px;font-weight:800; display:flex;align-items:center;justify-content:center; box-shadow:0 12px 30px rgba(232,80,45,0.28), inset 0 -6px 16px rgba(255,255,255,0.12); border:6px solid rgba(255,255,255,0.18); cursor:pointer }
  .mult-btn { width:62px;height:40px;border-radius:10px;background:#ffd27a;color:#2b2b2b;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.04); cursor:pointer }

  /* chat overlay bottom-left */
  .chat { position:absolute; left:14px; bottom:12px; width:64%; max-width:68%; background:var(--chat-bg); backdrop-filter: blur(6px); color:white; padding:10px 12px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.35); font-size:14px; z-index:50 }
  .chat .entry{ display:flex; gap:10px; align-items:flex-start }
  .chat .avatar-dot{ width:36px; height:36px; border-radius:50%; background:#7b45ff; display:flex; align-items:center; justify-content:center; font-weight:700; color:white }
  .chat .msg{ flex:1 }

  /* floating +xp effect */
  .float-xp {
    position:absolute; left:50%; transform:translateX(-50%); top:10%; color:#083a15; font-weight:800; font-size:18px; opacity:0; transition: transform 800ms ease, opacity 800ms ease;
  }

  /* toast */
  #toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:22px; background:#0f2436; color:#fff; padding:10px 14px; border-radius:10px; display:none; z-index:6000; box-shadow:0 12px 30px rgba(0,0,0,0.32) }

  /* bottom row */
  .bottom-row{ display:flex; align-items:center; gap:8px; padding:8px 6px; }
  .input-like{ flex:1; background:rgba(255,255,255,0.9); padding:10px; border-radius:999px; color:#2b5f2f; font-weight:700; border:1px solid rgba(0,0,0,0.06) }

  @media (max-width:430px){
    .app{width:100%;}
    .chat{width:72%}
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Monopoly Farm demo">

    <div class="hud" aria-hidden="false">
      <div class="hud-left">
        <div class="logo">🌳 Farm</div>
        <div class="stats" aria-hidden="false">
          <div class="stat" id="coins">32.7K</div>
          <div class="stat" id="gem">4455</div>
        </div>
      </div>

      <div class="hud-right">
        <div class="level" id="levelDisplay" aria-live="polite">Lv 1</div>
        <div class="progressWrap" title="Progress to next level">
          <div class="progressInner" id="progressInner" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="board-wrap" role="region" aria-label="Game board">
      <div class="farmCall" role="region" aria-label="Farm controls">
        <div style="font-weight:800;color:var(--primary)">Farm</div>
        <button class="harvestBtn" id="harvestBtn">Harvest</button>
        <div style="font-weight:700;color:#2b5f2f" id="harvestCount">0</div>
      </div>

      <div class="board" id="board"></div>

      <!-- center overlays: boss + avatars -->
      <div style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none">
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60%;height:60%;display:flex;align-items:center;justify-content:center;pointer-events:auto">
          <div class="center" aria-hidden="false">
            <div class="boss" id="boss" title="Boss - click to challenge">
              <div class="skull">💀</div>
              <div class="lv">Lv.41 • 268.3K</div>
              <div style="font-size:12px;color:#8a3b3b;margin-top:6px">×75</div>
            </div>

            <div class="avatarRow" style="pointer-events:auto">
              <div class="avatar" id="player1" title="Player 1">
                <div class="bubble" style="background:linear-gradient(180deg,#7b45ff,#5b27d0);width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white">J</div>
                <div class="name" style="font-size:12px;color:#2d5f33">Joelly</div>
              </div>

              <div class="avatar" id="player2" title="Player 2">
                <div class="bubble" style="background:linear-gradient(180deg,#58b368,#2fa84a);width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white">C</div>
                <div class="name" style="font-size:12px;color:#2d5f33">Captain John</div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- right-side menu -->
      <div class="menu" role="navigation" aria-label="Quick menu">
        <button id="taskBtn" title="Task">🏷️</button>
        <button id="dailyBtn" title="Daily Pack">🎁</button>
        <button id="refBtn" title="Referral">👥</button>
        <button id="withdrawBtn" title="Withdraw">💳</button>
      </div>

      <!-- bottom-right controls -->
      <div class="controls">
        <div class="mult-btn" id="mult">x1</div>
        <button class="go-btn" id="goBtn" aria-label="Go button">GO</button>
      </div>

      <!-- chat overlay -->
      <div class="chat" role="status" aria-live="polite">
        <div class="entry">
          <div class="avatar-dot">J</div>
          <div class="msg">
            <div style="font-weight:700">Joelly Matthew Edibo <span style="color:#cfe8cf;font-weight:600">entered the room</span></div>
            <div style="margin-top:6px">@Joelly Matthew Edibo click on Go to play your dice 🎲 and also try to challenge boss to get rewards buy daily pack to get rewards</div>
          </div>
        </div>
      </div>

      <div class="float-xp" id="floatXp">+0 XP</div>

    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div class="bottom-row">
      <div class="input-like">Type in Monopoly</div>
      <div style="width:44px;height:44px;border-radius:10px;background:#ffffff;border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">🎤</div>
      <div style="width:44px;height:44px;border-radius:10px;background:#ffffff;border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">🎁</div>
    </div>

  </div>

<script>
(function(){
  'use strict';

  // localStorage namespace
  const ns = 'monopoly_farm_';

  // state
  let xp = Number(localStorage.getItem(ns+'xp') || 0);
  let taps = Number(localStorage.getItem(ns+'taps') || 0);
  let harvestCount = Number(localStorage.getItem(ns+'harvest') || 0);
  let level = Number(localStorage.getItem(ns+'level') || 1);

  // DOM refs
  const board = document.getElementById('board');
  const goBtn = document.getElementById('goBtn');
  const multBtn = document.getElementById('mult');
  const toast = document.getElementById('toast');
  const floatXp = document.getElementById('floatXp');
  const harvestBtn = document.getElementById('harvestBtn');
  const harvestCountEl = document.getElementById('harvestCount');
  const levelDisplay = document.getElementById('levelDisplay');
  const progressInner = document.getElementById('progressInner');
  const coinsEl = document.getElementById('coins');
  const gemEl = document.getElementById('gem');

  function showToast(msg, timeout=2000){
    toast.textContent = msg;
    toast.style.display = 'block';
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(()=> toast.style.display = 'none', timeout);
  }

  function showFloat(msg){
    floatXp.textContent = msg;
    floatXp.style.opacity = '1';
    floatXp.style.transform = 'translateX(-50%) translateY(-10px)';
    clearTimeout(showFloat.timer);
    showFloat.timer = setTimeout(()=> {
      floatXp.style.opacity = '0';
      floatXp.style.transform = 'translateX(-50%) translateY(-40px)';
    }, 900);
  }

  // update UI & persist
  function updateUI(){
    level = Math.max(1, Math.floor(xp / 500) + 1);
    levelDisplay.textContent = 'Lv ' + level;
    const progressPercent = ((xp % 500) / 500) * 100;
    progressInner.style.width = progressPercent + '%';
    coinsEl.textContent = Number(xp).toLocaleString();
    gemEl.textContent = '4455';
    harvestCountEl.textContent = harvestCount;
    localStorage.setItem(ns+'xp', String(xp));
    localStorage.setItem(ns+'taps', String(taps));
    localStorage.setItem(ns+'harvest', String(harvestCount));
    localStorage.setItem(ns+'level', String(level));
  }

  // construct board (7x7) and keep path indexes
  const size = 7;
  const total = size*size;
  for(let i=0;i<total;i++){
    const r = Math.floor(i/size), c = i%size;
    const cell = document.createElement('div'); cell.className='cell';
    if(r===0||r===size-1||c===0||c===size-1){
      const tile = document.createElement('div'); tile.className='tile';
      if((r===0&&c===0)||(r===0&&c===size-1)||(r===size-1&&c===0)||(r===size-1&&c===size-1)){
        tile.classList.add('corner'); tile.textContent = '★';
      } else {
        // alternate q and gold
        const odd = ((r+c)%2===0);
        if(odd){ tile.classList.add('q'); tile.textContent = '?'; } else { tile.classList.add('gold'); tile.textContent='□' }
      }
      cell.appendChild(tile);
    } else {
      const empty = document.createElement('div'); empty.style.width='100%'; empty.style.height='100%'; empty.style.background='transparent';
      cell.appendChild(empty);
    }
    board.appendChild(cell);
  }

  // compute border path indices (top row left->right, right col 1..5, bottom row right->left, left col 5..1)
  function getPathIndices(){
    const path = [];
    for(let c=0;c<size;c++) path.push({r:0,c});
    for(let r=1;r<size-1;r++) path.push({r,c:size-1});
    for(let c=size-1;c>=0;c--) path.push({r:size-1,c});
    for(let r=size-2;r>=1;r--) path.push({r,c:0});
    return path.map(p=> p.r*size + p.c);
  }
  const pathIdx = getPathIndices();
  const tileElems = pathIdx.map(i => {
    const el = board.children[i].querySelector('.tile');
    return el || null;
  });

  // token indicator & movement
  let tokenIndex = 0;
  function placeTokenAt(index){
    tokenIndex = index % tileElems.length;
    tileElems.forEach((t,idx)=> {
      if(!t) return;
      t.style.boxShadow = (idx===tokenIndex) ? '0 12px 30px rgba(0,0,0,0.25), 0 0 0 6px rgba(255,215,120,0.08)' : '0 6px 14px rgba(20,40,20,0.06)';
      t.style.transform = (idx===tokenIndex) ? 'translateY(-6px) scale(1.03)' : 'translateY(0) scale(1)';
      t.style.transition = 'transform 220ms ease, box-shadow 220ms ease';
    });
  }
  placeTokenAt(0);

  let rolling = false;
  let mult = 1;
  multBtn.addEventListener('click', ()=>{
    if(mult===1){ mult=2; multBtn.textContent='x2'; }
    else if(mult===2){ mult=5; multBtn.textContent='x5'; }
    else { mult=1; multBtn.textContent='x1'; }
    showToast('Multiplier: ' + mult);
  });

  async function animateSteps(steps, speed=110){
    if(rolling) return;
    rolling = true;
    const start = tokenIndex;
    for(let i=1;i<=steps;i++){
      const idx = (start + i) % tileElems.length;
      placeTokenAt(idx);
      await new Promise(r => setTimeout(r, speed));
    }
    rolling = false;
  }

  goBtn.addEventListener('click', async ()=> {
    if(rolling) return;
    const dice = Math.floor(Math.random()*6)+1;
    const steps = dice * mult;
    showToast('You rolled ' + dice + ' • ' + steps + ' steps', 1400);
    await animateSteps(steps, 100);
    // land effect & small reward for landing
    const landed = tokenIndex;
    taps += 1;
    // random small xp
    const reward = Math.floor(5 + Math.random()*15);
    xp += reward;
    showFloat('+' + reward + ' XP');
    showToast('Landed on tile — +' + reward + ' XP', 1400);
    updateUI();
  });

  // HARVEST logic (center farm action)
  harvestBtn.addEventListener('click', ()=> {
    // simple harvest: give XP and increment harvest count; show small animation
    const reward = 50 + Math.floor(Math.random()*51); // 50-100 XP
    xp += reward;
    harvestCount += 1;
    showFloat('+' + reward + ' XP');
    showToast('Harvested! +' + reward + ' XP', 1500);
    updateUI();
  });

  // quick menu buttons
  document.getElementById('taskBtn').addEventListener('click', ()=> {
    const reward = 25;
    xp += reward;
    showFloat('+' + reward + ' XP');
    showToast('Task completed! +' + reward + ' XP', 1600);
    updateUI();
  });
  document.getElementById('dailyBtn').addEventListener('click', ()=> {
    const reward = 120;
    xp += reward;
    showFloat('+' + reward + ' XP');
    showToast('Daily pack claimed! +' + reward + ' XP', 1600);
    updateUI();
  });
  document.getElementById('refBtn').addEventListener('click', ()=> {
    const reward = 40;
    xp += reward;
    showFloat('+' + reward + ' XP');
    showToast('Referral reward! +' + reward + ' XP', 1400);
    updateUI();
  });
  document.getElementById('withdrawBtn').addEventListener('click', ()=> {
    // demo withdraw: only show toast
    showToast('Withdraw requested (demo)', 1600);
  });

  // boss click
  document.getElementById('boss').addEventListener('click', ()=> {
    // pretend to challenge boss and get large reward
    const reward = 300;
    xp += reward;
    showFloat('+' + reward + ' XP');
    showToast('Boss defeated! +' + reward + ' XP', 2000);
    updateUI();
  });

  // small accessibility: Enter triggers GO
  document.addEventListener('keydown', (e)=> { if(e.key === 'Enter') goBtn.click(); });

  // init UI from localStorage
  updateUI();

  // expose small debug API
  window._monopolyFarm = {
    getState: ()=>({xp,taps,harvestCount,level})
  };

})();
</script>
</body>
</html>
