<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Monopoly Mini - Demo</title>
<style>
  :root{
    --bg:#cfeecf; /* soft green sky */
    --panel:#eaf7ef;
    --muted:#7b8b7b;
    --accent:#ff6b4a; /* GO button */
    --accent-2:#ffd27a; /* tile highlight */
    --tile:#fff;
    --tile-border:#f0d3a9;
    --hud-bg:rgba(255,255,255,0.9);
    --shadow: 0 8px 30px rgba(0,0,0,0.18);
    --glass: rgba(255,255,255,0.6);
    --primary:#2d7a3e;
    --card:#f7fff7;
    --chat-bg: rgba(10,10,10,0.45);
  }

  html,body{
    height:100%;
    margin:0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    background: linear-gradient(180deg,#cfeecf 0%, #e6f8e6 30%, #ffffff 100%);
    color:#132513;
    display:flex;
    justify-content:center;
    padding:18px;
    box-sizing:border-box;
  }

  .app {
    width:412px; /* typical mobile width preview */
    max-width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
  }

  /* HUD */
  .hud {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 12px;
    background:var(--hud-bg);
    border-radius:14px;
    box-shadow:var(--shadow);
    border:1px solid rgba(0,0,0,0.04);
  }
  .hud-left{display:flex;gap:10px;align-items:center}
  .logo {
    display:flex;align-items:center;gap:8px;font-weight:700;color:var(--primary);
  }
  .stats {display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  .stat {background:linear-gradient(180deg,#ffffff,#f2fff2);padding:6px 10px;border-radius:10px;border:1px solid rgba(0,0,0,0.04);font-weight:600}
  .level{background:#ffffff;padding:6px 10px;border-radius:999px;color:#0a6b2d;font-weight:700}

  /* Board area */
  .board-wrap{
    background: linear-gradient(180deg,#f7fff7,#ecfbea);
    border-radius:18px;
    padding:12px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }

  /* create a 7x7 grid, we'll fill only border cells for the track */
  .board {
    width:100%;
    aspect-ratio:1 / 1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(7,1fr);
    gap:6px;
    position:relative;
  }

  .cell{background:transparent;display:flex;align-items:center;justify-content:center}
  .tile{
    width:100%;
    height:100%;
    background:var(--tile);
    border-radius:8px;
    border:3px solid var(--tile-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:#2b4a2b;
    box-shadow: 0 6px 14px rgba(20,40,20,0.06);
    position:relative;
  }
  .tile.q { background:linear-gradient(180deg,#fff8e6,#fff6e0); color:#6b4a1f; font-weight:700 }
  .tile.gold { background:linear-gradient(180deg,#fffdf6,#fff3d9); color:#3b2a12; font-weight:700 }
  .tile.corner { border-radius:12px; font-weight:800; font-size:13px }

  /* center area */
  .center {
    grid-column: 3 / span 3;
    grid-row: 3 / span 3;
    background: #f6fff6;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    border:2px dashed rgba(0,0,0,0.03);
  }

  .boss {
    width:92px;height:92px;border-radius:14px;
    background:linear-gradient(180deg,#e6eaf7,#cfd6ff);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    box-shadow:0 10px 30px rgba(50,40,90,0.12), inset 0 -6px 12px rgba(0,0,0,0.04);
    border:4px solid rgba(0,0,0,0.04);
  }
  .boss .skull{font-size:34px}
  .boss .lv{font-size:11px;color:#4a4a4a;margin-top:6px}

  /* avatars on center */
  .avatar {
    display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px;
    transform:translateY(6px);
  }
  .avatar .bubble{
    width:40px;height:40px;border-radius:8px;background:linear-gradient(180deg,#ffd;,#fff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
    background:linear-gradient(180deg,#ffd27a,#ffc66a);box-shadow:0 6px 18px rgba(0,0,0,0.12)
  }
  .avatar .name{font-size:12px;color:#2d5f33}

  /* bottom right controls */
  .controls {
    position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  }
  .go-btn {
    width:118px;height:118px;border-radius:60px;background:linear-gradient(180deg,#ff6b4a,#e84f2f);
    color:white;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px rgba(232,80,45,0.28), inset 0 -6px 16px rgba(255,255,255,0.12);
    border:6px solid rgba(255,255,255,0.18);cursor:pointer;
  }
  .mult-btn {
    width:62px;height:40px;border-radius:10px;background:#ffd27a;color:#2b2b2b;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.04);
  }

  /* chat overlay bottom-left */
  .chat {
    position:absolute;left:14px;bottom:12px;width:68%;max-width:68%;
    background:var(--chat-bg);backdrop-filter: blur(6px);color:white;padding:10px 12px;border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    font-size:14px;
  }
  .chat .entry{display:flex;gap:10px;align-items:flex-start}
  .chat .avatar-dot{width:36px;height:36px;border-radius:50%;background:#7b45ff;display:flex;align-items:center;justify-content:center;font-weight:700;color:white}
  .chat .msg{flex:1}
  .chat .hint{margin-top:8px;font-size:13px;color:rgba(255,255,255,0.9)}

  /* energy bar */
  .energy {
    width:140px; height:30px;background:linear-gradient(180deg,#ffffff,#f0fff0);border-radius:999px;padding:4px;border:1px solid rgba(0,0,0,0.04);display:flex;align-items:center;gap:8px;
  }
  .energy .bar{flex:1;height:14px;background:#e8f7e8;border-radius:8px;overflow:hidden}
  .energy .bar-inner{height:100%;width:50%;background:linear-gradient(90deg,#00e0ff,#0077ff);transition:width:420ms ease}
  .energy .label{font-weight:700;color:#2b5f2f;font-size:12px}

  /* toast */
  #toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#0f2436;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:6000;box-shadow:0 12px 30px rgba(0,0,0,0.32)
  }

  /* helper small HUD bottom input row */
  .bottom-row{
    display:flex;align-items:center;gap:8px;padding:8px 6px;
  }
  .input-like{
    flex:1;background:rgba(255,255,255,0.9);padding:10px;border-radius:999px;color:#2b5f2f;font-weight:600;border:1px solid rgba(0,0,0,0.04)
  }

  /* responsive */
  @media (max-width:430px){
    .app{width:100%;}
    .chat{width:72%}
  }
</style>
</head>
<body>
  <div class="app" role="application" aria-label="Monopoly mini demo">

    <div class="hud" aria-hidden="false">
      <div class="hud-left">
        <div class="logo">🌳 Farm</div>
        <div class="stats">
          <div class="stat">32.7K</div>
          <div class="stat">EXP Lv.8</div>
          <div class="stat">4455</div>
        </div>
      </div>

      <div style="display:flex;gap:12px;align-items:center">
        <div class="level" aria-live="polite">Lv 8</div>
        <div class="energy" title="Energy">
          <div class="label">232 / 105</div>
          <div class="bar"><div class="bar-inner" id="energyInner" style="width:70%"></div></div>
        </div>
      </div>
    </div>

    <div class="board-wrap" role="region" aria-label="Game board">
      <div class="board" id="board">
        <!-- grid cells: JS will fill border cells with tiles -->
        <!-- create 7x7 empty cells -->
        <script>
          // small inline script to render the 7x7 cells quickly and place tiles
        </script>
      </div>

      <!-- bottom-right controls -->
      <div class="controls">
        <div class="mult-btn" id="mult">x1</div>
        <button class="go-btn" id="goBtn" aria-label="Go button">GO</button>
      </div>

      <!-- center overlays: boss + avatars -->
      <div style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none">
        <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60%;height:60%;display:flex;align-items:center;justify-content:center;pointer-events:auto">
          <div class="center" aria-hidden="false">
            <div class="boss" id="boss">
              <div class="skull">💀</div>
              <div class="lv">Lv.41 • 268.3K</div>
              <div style="font-size:12px;color:#8a3b3b;margin-top:6px">×75</div>
            </div>

            <div style="display:flex;gap:18px;margin-top:12px">
              <div class="avatar" id="player1" title="Player 1" style="pointer-events:auto">
                <div class="bubble" style="background:linear-gradient(180deg,#7b45ff,#5b27d0);width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white">J</div>
                <div class="name">Joelly Matthew Edibo</div>
              </div>

              <div class="avatar" id="player2" title="Player 2" style="pointer-events:auto">
                <div class="bubble" style="background:linear-gradient(180deg,#58b368,#2fa84a);width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white">C</div>
                <div class="name">Co Captain John</div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- chat overlay -->
      <div class="chat" role="status" aria-live="polite">
        <div class="entry">
          <div class="avatar-dot">J</div>
          <div class="msg">
            <div style="font-weight:700">Joelly Matthew Edibo <span style="color:#cfe8cf;font-weight:600">entered the room</span></div>
            <div class="hint" style="margin-top:6px">@Joelly Matthew Edibo click on Go to play your dice 🎲 and also try to challenge boss to get rewards buy daily pack to get rewards</div>
          </div>
        </div>
      </div>

    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <div class="bottom-row" aria-hidden="false">
      <div class="input-like">Type in Monopoly</div>
      <div style="width:44px;height:44px;border-radius:10px;background:#ffffff;border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">🎤</div>
      <div style="width:44px;height:44px;border-radius:10px;background:#ffffff;border:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">🎁</div>
    </div>

  </div>

<script>
  (function(){
    // Build board: 7x7 cells; fill border with tiles
    const board = document.getElementById('board');
    const size = 7;
    const total = size * size;
    const tileTypes = ['gold','gold','gold','q']; // rotate a bit
    for(let i=0;i<total;i++){
      const r = Math.floor(i/size);
      const c = i % size;
      const cell = document.createElement('div');
      cell.className = 'cell';
      // border condition
      if(r === 0 || r === size-1 || c === 0 || c === size-1){
        const tile = document.createElement('div');
        tile.className = 'tile';
        // corners
        if((r===0 && c===0) || (r===0 && c===size-1) || (r===size-1 && c===0) || (r===size-1 && c===size-1)){
          tile.classList.add('corner');
          tile.textContent = '★';
        } else {
          // alternate q tiles
          const idx = Math.abs((r*size + c) % tileTypes.length);
          if(tileTypes[idx]==='q'){ tile.classList.add('q'); tile.innerHTML='?'; }
          else { tile.classList.add('gold'); tile.innerHTML='□'; }
        }
        cell.appendChild(tile);
      } else {
        // center empty
        const empty = document.createElement('div');
        empty.style.width='100%'; empty.style.height='100%';
        empty.style.background='transparent';
        cell.appendChild(empty);
      }
      board.appendChild(cell);
    }

    // simple movement demo when GO pressed: highlight successive border tiles
    const goBtn = document.getElementById('goBtn');
    const toast = document.getElementById('toast');
    const multBtn = document.getElementById('mult');
    let rolling = false;
    let mult = 1;

    multBtn.addEventListener('click', ()=>{
      if(mult === 1) mult = 2, multBtn.textContent='x2';
      else if(mult === 2) mult = 5, multBtn.textContent='x5';
      else mult = 1, multBtn.textContent='x1';
      showToast('Multiplier set: ' + mult);
    });

    function showToast(msg, timeout=2000){
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(()=>{ toast.style.display = 'none'; }, timeout);
    }

    // collect border tiles list (in board DOM order). We'll just animate a highlight to simulate a token moving.
    const tiles = Array.from(document.querySelectorAll('.board .tile'));
    // make a path in order: top row left->right, right col top->bottom, bottom row right->left, left col bottom->top
    // but our tile list is in DOM order; instead build the path programmatically
    function getBorderPath(){
      const path = [];
      // top row (0,0..6)
      for(let c=0;c<size;c++) path.push({r:0,c});
      // right col (1..5)
      for(let r=1;r<size-1;r++) path.push({r,c:size-1});
      // bottom row (6,6..0)
      for(let c=size-1;c>=0;c--) path.push({r:size-1,c});
      // left col (5..1)
      for(let r=size-2;r>=1;r--) path.push({r,c:0});
      // map to index in board children
      return path.map(p => p.r*size + p.c);
    }
    const pathIdx = getBorderPath();
    const tileElems = pathIdx.map(i => board.children[i].querySelector('.tile'));

    // place a simple token indicator on one tile (start)
    let tokenIndex = 0;
    function placeTokenAt(index){
      tokenIndex = index % tileElems.length;
      // remove extras
      tileElems.forEach((t,idx)=> {
        if(!t) return;
        t.style.boxShadow = (idx===tokenIndex) ? '0 12px 30px rgba(0,0,0,0.25), 0 0 0 6px rgba(255,215,120,0.08)' : '0 6px 14px rgba(20,40,20,0.06)';
        t.style.transform = (idx===tokenIndex) ? 'translateY(-6px) scale(1.03)' : 'translateY(0) scale(1)';
        if(idx===tokenIndex){
          t.style.transition = 'transform 250ms ease, box-shadow 250ms ease';
        } else {
          t.style.transition = 'transform 250ms ease, box-shadow 250ms ease';
        }
      });
    }
    placeTokenAt(0);

    async function animateSteps(steps, speed=120){
      if(rolling) return;
      rolling = true;
      let start = tokenIndex;
      for(let i=1;i<=steps;i++){
        const idx = (start + i) % tileElems.length;
        placeTokenAt(idx);
        await new Promise(r => setTimeout(r, speed));
      }
      rolling = false;
    }

    goBtn.addEventListener('click', async ()=>{
      if(rolling) return;
      // simple dice roll demo
      const dice = Math.floor(Math.random()*6) + 1;
      const steps = dice * mult;
      showToast('You rolled ' + dice + ' → ' + steps + ' steps', 1600);
      await animateSteps(steps, 110);
      // if lands near boss quadrant, show reward hint
      const landed = tokenIndex;
      if(landed % 5 === 0){
        showToast('Challenge boss available!', 2200);
      } else {
        showToast('You landed on a tile', 1400);
      }
    });

    // small demo: click boss to award XP (visual only)
    document.getElementById('boss').addEventListener('click', ()=>{
      showToast('Boss challenged! Claim rewards.', 1800);
    });

    // keyboard support (Enter triggers GO) for desktop
    document.addEventListener('keydown', (e)=> {
      if(e.key === 'Enter') goBtn.click();
    });

  })();
</script>
</body>
</html>
