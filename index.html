<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tap & Earn X</title>

<!-- Telegram Web App + Adsgram (kept as in your original) -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="https://sad.adsgram.ai/js/sad.min.js" defer></script>

<style>
:root{
  --bg:#07111f;
  --card:#101b2d;
  --muted:rgba(255,255,255,0.8);
  --accent1:#00e0ff;
  --accent2:#0077ff;
  --border:#1f2d44;
  --glass:rgba(255,255,255,0.03);
  --success:#58b368;
  --danger:#e74c3c;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{
  background:var(--bg);
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  padding:18px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.25;
}

/* header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:22px;font-weight:700;color:var(--accent1);display:flex;align-items:center;gap:10px}
.level{background:#132033;padding:8px 14px;border-radius:30px;font-size:14px}

/* balance */
.balance-box{
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  border-radius:20px;padding:22px 18px;color:#000;margin-bottom:20px;
  box-shadow:0 6px 20px rgba(0,0,0,0.45);
}
.balance-box p{opacity:0.9}
.balance-box h2{font-size:46px;margin-top:8px}

/* progress bars */
.progress{width:100%;height:10px;background:rgba(255,255,255,0.12);border-radius:999px;overflow:hidden;margin-top:12px}
.progress div{width:0;height:100%;background:#fff;transition:width 400ms ease}

/* grid cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--card);padding:14px;border-radius:14px;border:1px solid var(--border)}
.card h3{font-size:15px;margin-bottom:8px}
.card p{font-size:13px;color:var(--muted)}

/* section + controls */
.section{background:var(--card);padding:16px;border-radius:14px;margin-bottom:14px;border:1px solid var(--border)}
.section h2{font-size:16px;margin-bottom:10px}

.btn{
  display:inline-block;width:100%;padding:12px;border-radius:12px;border:none;
  background:linear-gradient(45deg,var(--accent1),var(--accent2));color:#000;font-weight:700;
  font-size:15px;cursor:pointer;
}
.btn:active{transform:scale(0.99)}
.btn[disabled]{opacity:0.55;cursor:not-allowed;transform:none}

/* daily bar */
#dailyProgressBar{width:100%;height:8px;background:#1b2a40;border-radius:20px;overflow:hidden;margin-top:10px}
#dailyProgressBar div{height:100%;width:0;background:var(--accent1);transition:width 320ms ease}

/* join popup */
#joinPopup{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;place-items:center;
  z-index:9999;padding:20px;
}
#joinPopup .card{max-width:420px;text-align:center}
#joinPopup button{padding:12px 18px;border-radius:10px;background:var(--accent1);border:none;color:#000;font-weight:700}

/* preview helpers */
.preview-row{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px}
.big-go{font-size:28px;background:var(--danger);color:white;width:108px;height:108px;border-radius:54px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wheel{background:linear-gradient(180deg,#ffd27a,#ffc66a);width:108px;height:108px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.harvestBtn{background:var(--success);padding:16px 20px;border-radius:12px;color:#000;font-weight:700;cursor:pointer}

/* inputs */
input,select{width:100%;padding:10px;border-radius:10px;border:none;background:#18263b;color:white;margin-top:8px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0f2436;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:2000;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
@media (max-width:700px){
  .grid{grid-template-columns:1fr}
  .leftCol{width:100%}
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">⚡ Tap & Earn X</div>
  <div class="level" aria-live="polite">Level <span id="level">1</span></div>
</div>

<div class="balance-box" role="region" aria-label="Total experience">
  <p>Total XP</p>
  <h2 id="points">0</h2>
  <div class="progress" aria-hidden="true"><div id="bar" style="width:0%"></div></div>
</div>

<div class="grid">
  <div class="card">
    <h3>👆 Total Taps</h3>
    <p id="taps">0</p>
  </div>

  <div class="card">
    <h3>🏆 Rank</h3>
    <p id="rank">Starter</p>
  </div>
</div>

<div class="section" aria-labelledby="tap-section">
  <h2 id="tap-section">🎮 Tap System</h2>
  <button class="btn" id="tapBtn" type="button" aria-pressed="false">Tap +1 XP</button>
</div>

<div class="section" aria-labelledby="reward-section">
  <h2 id="reward-section">📺 Reward Ad</h2>
  <button class="btn" id="rewardBtn" type="button">Watch Ad +10 XP</button>
</div>

<div class="section" aria-labelledby="task-section">
  <h2 id="task-section">🎯 Task Center</h2>
  <button class="btn" id="taskBtn" type="button">Complete Task +10 XP</button>
</div>

<div class="section" aria-labelledby="daily-section">
  <h2 id="daily-section">🎁 Daily Reward</h2>
  <button class="btn" id="dailyBtn" type="button">Start Daily Bonus</button>
  <div id="dailyProgressBar"><div style="width:0%"></div></div>
</div>

<div class="section" aria-labelledby="ref-section">
  <h2 id="ref-section">👥 Referral</h2>
  <input id="refInput" readonly value="https://t.me/@Profitvablebot?start=12345" aria-label="Referral link">
  <button class="btn" id="copyBtn" type="button">Copy Referral Link</button>
</div>

<div class="section" aria-labelledby="withdraw-section">
  <h2 id="withdraw-section">💳 Withdraw</h2>
  <label class="sr-only" for="method">Method</label>
  <select id="method" aria-label="Withdraw method">
    <option>USDT</option>
    <option>Litecoin</option>
    <option>Payeer</option>
    <option>Bank</option>
  </select>

  <input id="wallet" placeholder="Wallet Address" aria-label="Wallet address">
  <input id="amount" type="number" placeholder="Amount" aria-label="Amount to withdraw">

  <button class="btn" id="withdrawBtn" type="button">Withdraw XP</button>
</div>

<!-- JOIN POPUP -->
<div id="joinPopup" role="dialog" aria-modal="true" aria-labelledby="joinTitle">
  <div class="card">
    <h2 id="joinTitle" style="margin-bottom:12px">Join Our Channel</h2>
    <p style="color:var(--muted);margin-bottom:14px">Join our channel to earn +5 XP</p>
    <button id="joinBtn" type="button">Join Channel +5 XP</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/*
  Updated index.html
  - Improved checks around Adsgram and Telegram API
  - Modern clipboard usage
  - Daily reward uses date-based reset (per-calendar-day)
  - Small toast system for better UX
  - localStorage keys namespaced to avoid collisions
*/

(function(){
  'use strict';

  const ns = 'tapearnx_'; // localStorage namespace
  const MIN_WITHDRAW = 10000;

  // Telegram WebApp (optional)
  const tg = window?.Telegram?.WebApp;
  try { tg?.expand?.(); } catch (e) { /* ignore if not available */ }

  // State (load from localStorage)
  let xp = Number(localStorage.getItem(ns + 'xp') || 0);
  let taps = Number(localStorage.getItem(ns + 'taps') || 0);
  // dailyProgress: 0..3 steps, dailyDate: 'YYYY-MM-DD' when completed the full set
  let dailyProgress = Number(localStorage.getItem(ns + 'dailyProgress') || 0);
  let dailyDate = localStorage.getItem(ns + 'dailyDate') || null;

  // Adsgram placeholders
  let rewardAd = null;
  let taskAd = null;

  // daily task blocks (kept from your code)
  const DAILY_BLOCKS = ["task-29806","task-29807","task-29808","task-29809"];

  // DOM refs
  const ptsEl = document.getElementById('points');
  const tapsEl = document.getElementById('taps');
  const levelEl = document.getElementById('level');
  const barEl = document.getElementById('bar');
  const dailyBarInner = document.querySelector('#dailyProgressBar div');
  const rewardBtn = document.getElementById('rewardBtn');
  const taskBtn = document.getElementById('taskBtn');
  const dailyBtn = document.getElementById('dailyBtn');
  const tapBtn = document.getElementById('tapBtn');
  const copyBtn = document.getElementById('copyBtn');
  const refInput = document.getElementById('refInput');
  const withdrawBtn = document.getElementById('withdrawBtn');
  const joinPopup = document.getElementById('joinPopup');
  const joinBtn = document.getElementById('joinBtn');
  const toastEl = document.getElementById('toast');

  // small toast helper
  let toastTimer = null;
  function showToast(msg, timeout = 2500){
    if(toastTimer) clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    toastTimer = setTimeout(()=> { toastEl.style.display = 'none'; toastTimer = null; }, timeout);
  }

  // format
  function fmt(n){ return Number(n).toLocaleString(); }

  // update UI and persist
  function updateUI(){
    ptsEl.innerText = fmt(xp);
    tapsEl.innerText = fmt(taps);
    const level = Math.floor(xp / 500) + 1;
    levelEl.innerText = level;
    const progressPercent = ((xp % 500) / 500) * 100;
    barEl.style.width = progressPercent + '%';

    localStorage.setItem(ns + 'xp', String(xp));
    localStorage.setItem(ns + 'taps', String(taps));
    localStorage.setItem(ns + 'dailyProgress', String(dailyProgress));
    if(dailyDate) localStorage.setItem(ns + 'dailyDate', dailyDate);
    updateDailyBar();
  }

  function updateDailyBar(){
    // if dailyDate is today and progress reset, show complete; otherwise show progress of 4 steps
    const percent = (dailyProgress / 4) * 100;
    dailyBarInner.style.width = percent + '%';
  }

  // day utilities (YYYY-MM-DD)
  function todayKey(){
    const d = new Date();
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
  }
  function isSameDay(key){
    return key === todayKey();
  }

  // init Adsgram safely (if present). Ads are optional; we guard calls.
  window.addEventListener('load', () => {
    if(typeof Adsgram !== 'undefined'){
      try{
        rewardAd = Adsgram.init({ blockId: '29779' });
        taskAd = Adsgram.init({ blockId: '29780' });

        // attempt to preload an optional join ad; show popup on completion or after timeout fallback
        const joinAd = Adsgram.init({ blockId: '35248' });
        const joinTimeout = setTimeout(() => { showJoinPopup(); }, 2200);
        if(joinAd && typeof joinAd.show === 'function'){
          // we won't display the ad visually now, but call show and then show popup; if show rejects, still show popup
          joinAd.show().finally(() => { clearTimeout(joinTimeout); showJoinPopup(); });
        } else {
          clearTimeout(joinTimeout);
          showJoinPopup();
        }
      }catch(err){
        // fail silently and show popup fallback
        showJoinPopup();
      }
    } else {
      // Adsgram not available -> show join popup after slight delay
      setTimeout(showJoinPopup, 700);
    }
    updateUI();
  });

  function showJoinPopup(){
    if(!joinPopup) return;
    // only show popup if not already joined today (basic guard)
    const joinedKey = localStorage.getItem(ns + 'joined') === '1';
    if(!joinedKey){ joinPopup.style.display = 'grid'; }
  }

  // actions
  tapBtn.addEventListener('click', () => {
    xp += 1; taps += 1; updateUI();
  });

  rewardBtn.addEventListener('click', async () => {
    if(!rewardAd || typeof rewardAd.show !== 'function'){
      showToast('Ad not available');
      return;
    }
    rewardBtn.disabled = true;
    try{
      const r = await rewardAd.show();
      if(r?.done){ xp += 10; updateUI(); showToast('+10 XP'); }
    }catch(e){
      console.warn('reward ad failed', e);
      showToast('Ad failed');
    } finally { rewardBtn.disabled = false; }
  });

  taskBtn.addEventListener('click', async () => {
    if(!taskAd || typeof taskAd.show !== 'function'){
      showToast('Task ad not available');
      return;
    }
    taskBtn.disabled = true;
    try{
      const r = await taskAd.show();
      if(r?.done){ xp += 10; updateUI(); showToast('Task complete +10 XP'); }
    }catch(e){
      console.warn('task ad failed', e);
      showToast('Ad failed');
    } finally { taskBtn.disabled = false; }
  });

  // DAILY: use blocks; after 4 steps grant big reward and mark dailyDate
  dailyBtn.addEventListener('click', async () => {
    // if already completed today, don't allow
    if(dailyDate && isSameDay(dailyDate)){
      showToast('Daily bonus already claimed today');
      return;
    }

    // create an adsgram task element if Adsgram available
    if(typeof Adsgram === 'undefined'){
      showToast('Daily tasks currently unavailable (ads not loaded)');
      return;
    }

    if(dailyProgress >= 4){
      showToast('All daily steps complete — claim pending');
      return;
    }

    // pick the block id for current progress
    const blockId = DAILY_BLOCKS[dailyProgress] || DAILY_BLOCKS[DAILY_BLOCKS.length - 1];
    const taskEl = document.createElement('adsgram-task');
    taskEl.setAttribute('data-block-id', blockId);
    // append task into DOM so Adsgram can mount
    document.body.appendChild(taskEl);

    // listen for reward event (your original pattern)
    const onReward = () => {
      dailyProgress = Math.min(4, dailyProgress + 1);
      taskEl.removeEventListener('reward', onReward);
      if(taskEl.parentNode) taskEl.parentNode.removeChild(taskEl);

      if(dailyProgress >= 4){
        // full daily completed: grant big XP and set dailyDate to today
        xp += 900;
        dailyDate = todayKey();
        dailyProgress = 0; // reset visible steps for the next day
        localStorage.setItem(ns + 'dailyDate', dailyDate);
        showToast('🎉 Daily bonus completed! +900 XP', 3500);
      } else {
        showToast(`Step ${dailyProgress} completed!`);
      }
      updateUI();
    };

    taskEl.addEventListener('reward', onReward, { once: true });

    // Adsgram: call load if available
    try { if(typeof taskEl.load === 'function') taskEl.load(); } catch(e){ console.warn('task load error', e); }
  });

  // join popup button
  joinBtn.addEventListener('click', () => {
    xp += 5;
    localStorage.setItem(ns + 'joined', '1'); // do not re-show popup
    updateUI();
    joinPopup.style.display = 'none';
    // open channel link in new tab (safe)
    window.open('https://saveapp.store/sl/65pk5', '_blank', 'noopener');
    showToast('+5 XP for joining');
  });

  // referral copy — use modern clipboard when possible
  copyBtn.addEventListener('click', async () => {
    const text = refInput.value || '';
    if(navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(text);
        showToast('Referral link copied');
      }catch(err){
        fallbackCopy(text);
      }
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text){
    try{
      refInput.select();
      document.execCommand('copy');
      window.getSelection()?.removeAllRanges?.();
      showToast('Referral link copied');
    }catch(e){
      showToast('Copy failed');
    }
  }

  // withdraw
  withdrawBtn.addEventListener('click', () => {
    const amount = Number(document.getElementById('amount').value || 0);
    if(!Number.isFinite(amount) || amount <= 0){
      showToast('Enter a valid amount');
      return;
    }
    if(amount < MIN_WITHDRAW){
      showToast(`Minimum ${MIN_WITHDRAW.toLocaleString()} XP`);
      return;
    }
    if(amount > xp){
      showToast('Not enough XP');
      return;
    }
    // simple withdrawal flow (demo)
    xp -= amount;
    updateUI();
    showToast('Withdraw request submitted');
  });

  // init UI
  // If dailyDate is not today and dailyProgress is 0, keep as-is. If dailyDate is different day, allow new progress.
  if(dailyDate && isSameDay(dailyDate)){
    // user already completed daily today => ensure progress reset and prevent re-grant
    dailyProgress = 0;
  } else if(dailyDate && !isSameDay(dailyDate)) {
    // not same day => reset stored daily date and progress
    dailyDate = null;
    dailyProgress = Number(localStorage.getItem(ns + 'dailyProgress') || 0);
  }

  updateUI();

  // small accessibility: keyboard Enter on inputs triggers corresponding buttons
  document.getElementById('amount').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') withdrawBtn.click();
  });

  // Expose for debugging temporarily
  window._tapEarn = {
    getState: () => ({ xp, taps, dailyProgress, dailyDate })
  };

})();
</script>
</body>
</html>
